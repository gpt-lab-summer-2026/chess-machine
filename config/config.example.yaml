# chessmachine configuration — copy to config/config.yaml and edit.
# Every key is optional; anything omitted uses the built-in default
# (see src/chessmachine/config.py). Unknown keys are rejected loudly.

app:
  play_as: black            # color the MACHINE plays: white | black
  auto_reply: true          # after the opponent's move, immediately make ours
  confirm_moves: true       # speak each move as it is executed
  concurrent_actuation: true # speak the move + explanation while the crane moves
                             # (a capture's discard always finishes first)
  match_clock: true         # track the human's thinking time only (ask "status"/"score")
  rehome_after_move: true   # re-home the crane after EVERY finished move to zero open-loop drift
  rehome_on_capture: true   # narrower fallback (captures only); subsumed when rehome_after_move is on
  self_critique_only_if_punished: true  # only voice the machine's OWN blunder if the opponent punishes it
  log_level: INFO

audio:
  input_device: null        # null = system default mic
  output_device: null
  sample_rate: 16000        # whisper wants 16 kHz mono
  vad:
    enabled: true
    aggressiveness: 2       # 0..3
    silence_ms: 800         # trailing silence that ends an utterance
    min_speech_ms: 250      # ignore blips shorter than this (avoids phantom moves)

stt:
  backend: distil_whisper   # distil_whisper | stdin (dev)
  model: distil-small.en    # faster-whisper alias -> CTranslate2 (use distil-medium.en for accuracy)
  device: cpu
  compute_type: int8
  language: en

tts:
  backend: kokoro           # kokoro | stdout (dev)
  voice: af_heart
  speed: 1.0
  model_path: models/kokoro/kokoro-v1.0.onnx
  voices_path: models/kokoro/voices-v1.0.bin

slm:
  backend: llama_cpp        # llama_cpp | rule_based (dev/fallback, no model)
  mode: server              # server (run llama-server) | inproc (llama-cpp-python)
  server_url: http://127.0.0.1:8080
  model_path: models/slm/model.gguf   # used only in inproc mode
  n_ctx: 4096
  n_threads: 4
  n_gpu_layers: 0           # inproc only: layers to offload to GPU (-1 = all)
  temperature: 0.2
  max_tokens: 256

engine:
  backend: stockfish        # stockfish | random (dev/fallback)
  stockfish_path: stockfish # bare command -> auto-detected on PATH and in the
                            # usual winget/scoop/apt/brew locations. Set an
                            # absolute path only to override that.
  threads: 2
  hash_mb: 256
  default_difficulty: medium
  presets:                  # voice "set difficulty <name>" picks one of these
    easy:   { elo: 800,  depth: 6,  movetime_ms: 300,  skill: 3 }
    medium: { elo: 1500, depth: 12, movetime_ms: 800,  skill: 10 }
    hard:   { elo: 2400, depth: 18, movetime_ms: 1500, skill: 20 }

motion:
  backend: relay            # relay (DC-motor prototype) | serial (crane) | mock (dev)
  relay:                    # active DC-motor prototype backend
    # One DC motor via a 2-channel relay H-bridge (firmware/esp32_dc_prototype).
    # No positioning yet: each move just pulses the motor — the user's moves run
    # it one way, the machine's the other. Bring up / verify with:
    #   python scripts/relay_jog.py --config config/config.yaml
    port: /dev/ttyUSB0      # Windows: COM3
    baud: 115200
    pulse_ms: 800           # how long the motor runs per move
  serial:                   # crane (DC/stepper hybrid) backend — unused while backend: relay
    port: /dev/ttyUSB0      # Windows: COM3
    baud: 115200
    timeout_s: 5.0
    winch_offset_mm: 33.0   # magnet hangs this far to the SIDE of the arm; the
                            # transport aims the cart past the target to compensate.
                            # Flip the sign if placements land on the wrong side; 0 = off.
  geometry:
    # Planar (x,z) mm with the ORIGIN AT THE CRANE PIVOT; the serial transport
    # converts to polar (r=hypot, theta=atan2) for the rotary + radial axes.
    # The board sits CORNER-FIRST (diagonal): h8 in the near deadzone, a1 farthest,
    # a8 on the right. See docs/DESIGN.md for the geometry budget.
    r_min_mm: 118.0         # nearest square (h8) magnet radius ~120 mm; cart floor is home 117.5
    r_max_mm: 390.0         # farthest square (a1) magnet radius ~387 mm (cart max reach is 437.5)
    board_size_mm: 216.0    # square 8x8 side = 8-tile playing span
    square_pitch_mm: 27.0   # 216 mm board / 8
    board_angle_deg: 135.0  # corner-first diagonal: the h8->a1 diagonal lies along the
                            # arm centreline (theta 0); a8 on the right (-z).
    # Origin = center of a1 (the FAR corner, on the bisector). With the 27 mm pitch
    # h8 lands ~120 mm out and a1 ~387 mm; both inside the ~437 mm cart reach.
    origin_x_mm: 387.3
    origin_z_mm: 0.0
    file_axis: x            # files a..h run along this axis BEFORE the rotation
    rank_axis: z            # ranks 1..8 run along this axis before the rotation
    invert_file: false      # flip if the board comes out mirrored (a8/h1 swapped)
    invert_rank: false
    travel_height_mm: 60.0  # pulley raised: clears pieces AND decouples magnetically
    pick_height_mm: 4.0     # pulley lowered: magnet touches a piece
    # Captured-piece storage: two symmetric arcs OUTSIDE the board's ~+/-32deg
    # diagonal sweep. TODO: proper rework for the diagonal layout.
    graveyard_radius_mm: 293.0
    graveyard_slots_per_side: 8
    graveyard_inner_deg: 37.0   # start beyond the board's ~32deg diagonal sweep
    graveyard_outer_deg: 52.0   # stay inside the rotary soft limit (~55deg)
  speeds:
    travel_feed: 4000       # mm/min
    lift_feed: 1500
    settle_ms: 250          # damp cable swing after a move
  magnet:
    settle_ms: 300
