# chessmachine configuration — copy to config/config.yaml and edit.
# Every key is optional; anything omitted uses the built-in default
# (see src/chessmachine/config.py). Unknown keys are rejected loudly.

app:
  play_as: black            # color the MACHINE plays: white | black
  auto_reply: true          # after the opponent's move, immediately make ours
  confirm_moves: true       # speak each move as it is executed
  concurrent_actuation: false # OFF = one thing at a time: speak the move fully, THEN move the
                             # crane. Set true to speak while the crane runs (faster, less legible).
  match_clock: true         # track the human's thinking time only (ask "status"/"score")
  rehome_after_move: false   # the base limit switch bounds drift, so don't home every turn
  rehome_every_n_moves: 10   # instead, re-home every 10 finished machine moves (~20-30 s each)
  log_level: INFO

audio:
  input_device: Trust       # substring-matched against the PortAudio device name, so it
                            # survives card renumbering on replug (hw:2,0 today, hw:3,0
                            # tomorrow). Currently the Trust GXT234 YUNIX USB mic.
                            # MUST be pinned, NOT "default": the BT speaker (BTL-324)
                            # publishes its own HSP mic, and PipeWire made THAT the
                            # default source -- recording from it is both near-silent
                            # (rms 0.0008 vs 0.015 on the Trust) and forces the speaker
                            # out of A2DP into 8 kHz narrowband, wrecking playback too.
                            # Like the old AK5370, this mic does 44.1/48 kHz ONLY and
                            # REJECTS the 16 kHz whisper needs (PaErrorCode -9997) --
                            # hence capture_rate below, never sample_rate.
  output_device: null       # unused: playback goes via pw-play (see voice/audio.py)
  sample_rate: 16000        # what WHISPER is fed. Fixed by the model -- leave at 16000.
  capture_rate: 48000       # what the MIC is opened at: its native rate. We capture full-rate
                            # and downsample ourselves (anti-aliased, voice/audio.resample)
                            # instead of letting PipeWire's resampler do it unseen.
                            # Must be one of webrtcvad's 8/16/32/48 kHz.
  listen_beep: true         # short earcon the instant the mic opens = "speak now"
  vad:
    enabled: true
    aggressiveness: 2       # 0..3
    silence_ms: 1500        # trailing silence that ends an utterance. 800 cut people
                            # off mid-phrase ("knight to... f3"); 1500 tolerates a pause.
    min_speech_ms: 250      # ignore blips shorter than this (avoids phantom moves)
    max_utterance_s: 7.0    # HARD cap on the whole listen window: the mic cuts off here even
                            # if you keep talking, so each turn is bounded. Speak promptly after
                            # the beep. VAD still ends it earlier on trailing silence.

stt:
  backend: distil_whisper   # distil_whisper (USB mic via sounddevice) | esp32_whisper (MAX4466 serial) | network_whisper (phone over WiFi, see docs/phone_mic_setup.md) | stdin (dev)
  model: distil-small.en      # faster-whisper alias -> CTranslate2. distil-large-v3.5 is
                              # 26-29 s/utterance on this CPU (vs 6.2 s) -- don't go back.
  device: cpu
  compute_type: int8          # CPU: int8 | int8_float32 | float32 only. int8_float16 is CUDA-only and raises.
  cpu_threads: 3              # 3 beats 4 on a 4-core Pi 5 (measured); leaves a core for llama-server
  language: en
  # Anti-hallucination on short/quiet commands. distil-small.en hallucinates on
  # quiet input ("d2 to d4" -> "to do four"); these recover it at no extra latency
  # (measured 2026-07-30). Tune with scripts/mictest.py --save + pw-play to hear
  # the actual capture, and mictest.py to see the transcript.
  beam_size: 5               # beam search, not greedy (=1). ~free here, far more robust.
  normalize: true            # level-normalize each utterance; Whisper hallucinates when it's quiet
  target_rms: 0.12           # normalize toward this loudness (gain capped so it never clips)
  pad_ms: 200                # frame the clip with silence so a short command isn't clipped
  vad_filter: false          # capture already VAD-gates (webrtcvad); Whisper's internal Silero VAD
                             # double-trimmed short clips and mangled them. true only if room noise
                             # starts getting transcribed on false triggers.

tts:
  backend: kokoro           # kokoro | stdout (dev)
  voice: af_heart
  speed: 1.0
  model_path: models/kokoro/kokoro-v1.0.onnx
  voices_path: models/kokoro/voices-v1.0.bin
  intra_op_threads: 2       # onnxruntime would otherwise take all 4 cores and spin while idle
  # Clipped first syllable ("chess machine ready" -> "ess machine ready"): the BTL-324
  # powers its amplifier down between utterances. keep_alive is the actual fix --
  # a silent lead_in can't wake a signal-detect amp, because silence is what put it
  # to sleep. Tune: python scripts/tts_leadin_test.py --keepalive
  keep_alive: true          # stream inaudible noise continuously so the amp never sleeps
  keep_alive_level: 0.002   # ~-54 dBFS. RAISE (0.004, 0.01) if the first syllable is STILL
                            # clipped; LOWER if you can hear hiss between utterances.
  lead_in_s: 0.5            # silence before each clip. Belt-and-suspenders now that keep_alive
                           # holds the amp up -- once that's confirmed working, drop this to
                           # 0.15 to make every reply snappier.
  lead_in_primer: false    # true = fill the lead-in with inaudible noise instead of silence
                           # (only useful if you turn keep_alive off)

slm:
  backend: llama_cpp        # llama_cpp | rule_based (dev/fallback, no model)
  mode: server              # server (run llama-server) | inproc (llama-cpp-python)
  server_url: http://127.0.0.1:8080
  model_path: models/slm/model.gguf   # used only in inproc mode
  n_ctx: 4096
  n_threads: 4
  temperature: 0.2
  max_tokens: 256

engine:
  backend: stockfish        # stockfish | random (dev/fallback)
  stockfish_path: stockfish # bare command -> auto-detected on PATH and in the
                            # usual winget/scoop/apt/brew locations. Set an
                            # absolute path only to override that.
  threads: 2
  hash_mb: 256
  default_difficulty: medium
  presets:                  # voice "set difficulty <name>" picks one of these
    easy:   { elo: 800,  depth: 6,  movetime_ms: 300,  skill: 3 }
    medium: { elo: 1500, depth: 12, movetime_ms: 800,  skill: 10 }
    hard:   { elo: 2400, depth: 18, movetime_ms: 1500, skill: 20 }

motion:
  backend: stepmap          # stepmap (ground-truth step map) | serial (geometry) | mock | relay
  stepmap:
    map_path: jeemap.json  # newest calibration (29 anchors); config/bestmap.json is the older 23-anchor one
    pick_below_mm: 30.0     # set_pulley height below this -> lower to the square's calibrated depth
    match_tol_mm: 1.0       # a move must land within this of a mapped square to use the map
  serial:
    port: /dev/ttyUSB0      # Windows: COM3
    baud: 460800           # MUST match esp32_chess.ino Serial.begin (8 kHz mic audio + commands)
    timeout_s: 90.0        # a full-length rail move is slow: ~26 s cart + 5 s settle. 30 s tripped it.
    home_timeout_s: 120.0  # HOME now seeks the base limit switch (up to a full sweep) then count-homes
                           # the winch + cart — give it plenty of headroom.
    winch_offset_mm: -15.0  # magnet hangs ~15 mm to the a8/+theta side of the arm. Derived from
                            # h8 landing ~7.2 deg off at r120 (asin(15/120)). Negative aims the
                            # cart the other way so the magnet lands on target. Flip sign if it
                            # lands toward h1; tune magnitude from the near-square residual.
  relay:                    # only used when backend: relay
    # Prototype DC motor via a 2-channel relay H-bridge
    # (firmware/esp32_dc_prototype). No positioning: each move just pulses the
    # motor — the user's moves run it one way, the machine's the other.
    port: /dev/ttyUSB0      # Windows: COM3
    baud: 115200
    pulse_ms: 800           # how long the motor runs per move
  geometry:
    # Planar (x,z) mm with the ORIGIN AT THE CRANE PIVOT; the serial transport
    # converts to polar (r=hypot, theta=atan2) for the rotary + radial axes.
    # See docs/DESIGN.md for the annular-sector geometry budget.
    # Corner-first (diagonal): h8 in the near deadzone, a1 farthest, a8 on the right.
    r_min_mm: 118.0         # nearest square (h8) magnet radius ~120 mm
    r_max_mm: 390.0         # farthest square (a1) magnet radius ~387 mm
    board_size_mm: 216.0    # 8x8 playing span
    square_pitch_mm: 27.0   # 216 mm / 8
    board_angle_deg: 135.0  # corner-first: the h8->a1 diagonal lies along the arm centreline (theta 0)
    # Origin = center of a1 (the FAR corner, on the bisector).
    origin_x_mm: 387.3
    origin_z_mm: 0.0
    file_axis: z            # SWAPPED from x: fixes the a8<->h1 mirror. The board was
    rank_axis: x            # reflected across the a1-h8 diagonal vs the model (a1/h8 on
                            # that diagonal stayed put; only the off-diagonal corners swapped).
    invert_file: false      # flip if the board comes out mirrored (a8/h1 swapped)
    invert_rank: false
    travel_height_mm: 60.0  # pulley raised: clears pieces AND decouples magnetically
    pick_height_mm: 4.0     # pulley lowered: magnet touches a piece
    # Captured-piece storage: a single circular DISH on the h1/-theta side (a8 is blocked
    # by the limit switch). Pieces are dumped in and pile up randomly — one-way, so
    # promotion/undo/reset ask you to place those pieces by hand.
    graveyard_center_r_mm: 270.0  # radial distance to the dish centre
    graveyard_center_deg: -48.0   # angle to the dish centre. THE knob: more negative = further off the
                                  # board's g/h edge (~43 steps/deg, so ~400 steps = ~9 deg). Tune empirically.
    graveyard_diameter_mm: 100.0  # 10 cm dish
    graveyard_jitter_mm: 15.0     # drop scatter so pieces don't stack on one exact point
    graveyard_capacity: 30
    graveyard_retrievable: false
  speeds:
    travel_feed: 4000       # mm/min
    lift_feed: 1500
    settle_ms: 250          # damp cable swing after a move
  magnet:
    settle_ms: 300
    hover_ms: 500           # dwell over a piece (magnet already on) before dipping to pick it up
    pick_dip_steps: 38      # extra winch steps to dip PAST the calibrated pick depth for sure contact
                            # on a PICK (the predetermined height isn't always exact). Drops don't dip.
