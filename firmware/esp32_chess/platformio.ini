; PlatformIO project for the chess-machine ESP32 firmware.
;   pio run            # build
;   pio run -t upload  # build + flash
;   pio device monitor # serial console
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    waspinator/AccelStepper@^1.64
