; PlatformIO project for the chess-machine ESP32 firmware.
;   pio run            # build
;   pio run -t upload  # build + flash
;   pio device monitor # serial console
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; No external libraries: the radial cart is a timed relay H-bridge, and the base
; + winch are both bit-banged ULN2003 steppers, so AccelStepper is not needed.
